[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canmcp"
version = "0.1.0"
description = "Local, safety-bounded remote MCP compatibility diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.14.3,<4", "jsonschema>=4.23,<5", "dnspython>=2.7,<3"]
keywords = ["mcp", "cli", "compatibility", "chatgpt", "claude"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "build>=1.2", "trustme>=1.2"]

[project.scripts]
canmcp = "canmcp.cli:main"

[tool.setuptools.packages.find]
include = ["canmcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
